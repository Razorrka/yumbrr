<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Notes for working the seafood counter.">
<meta name="theme-color" content="#E9EEEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E181C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fish Notes">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* the reset the artifact host normally provides */
  :root{
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>Fish Counter Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{
    --ground:#E9EEEF; --surface:#FFFFFF; --sunk:#F2F6F6;
    --ink:#12222A; --ink-2:#55696F; --ink-3:#8698A0;
    --line:#D3DDDF; --line-2:#E6ECED;
    --coral:#C8452F; --teal:#0D6A6E;
    --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
    --serif:"Source Serif 4",Georgia,serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E181C; --surface:#15242B; --sunk:#1B2E35;
      --ink:#E7EEEF; --ink-2:#A3B6BC; --ink-3:#7C9198;
      --line:#274049; --line-2:#1F343C;
      --coral:#F0836A; --teal:#5CBABD;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E181C; --surface:#15242B; --sunk:#1B2E35;
    --ink:#E7EEEF; --ink-2:#A3B6BC; --ink-3:#7C9198;
    --line:#274049; --line-2:#1F343C;
    --coral:#F0836A; --teal:#5CBABD;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px 40px}

  h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sub{font-family:var(--serif);font-size:14px;color:var(--ink-2);margin:4px 0 0}

  /* ---- list ---- */
  .list{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .edit-btn{
    flex:none;background:none;border:1px solid var(--line);border-radius:8px;cursor:pointer;
    font-family:var(--ui);font-size:13px;font-weight:600;color:var(--teal);
    padding:6px 13px;background:var(--surface);
  }
  .edit-btn[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}

  .row{
    display:flex;align-items:center;gap:10px;
    border-top:1px solid var(--line-2);padding:0 13px 0 15px;
  }
  .row:first-child{border-top:0}
  .row:hover{background:var(--sunk)}
  .row-open{
    display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;
    background:none;border:0;padding:15px 0;cursor:pointer;color:var(--ink);font-family:var(--ui);
  }
  .row-main{flex:1;min-width:0}
  .mv{display:none;flex-direction:column;gap:3px;flex:none}
  .mvb{
    width:30px;height:23px;display:grid;place-items:center;cursor:pointer;
    background:var(--sunk);border:1px solid var(--line);border-radius:6px;
    color:var(--ink-2);font-size:12px;line-height:1;padding:0;
  }
  .mvb:disabled{opacity:.3;cursor:default}
  .rm{
    display:none;flex:none;background:none;border:0;cursor:pointer;
    font-family:var(--ui);font-size:13px;font-weight:600;color:var(--coral);padding:8px 2px;
  }
  .list.editing .mv{display:flex}
  .list.editing .rm{display:block}
  .list.editing .arrow{display:none}
  .list.editing .row-open{cursor:default}
  .list.editing .row:hover{background:none}
  .row-name{font-size:16px;font-weight:600;letter-spacing:-.005em}
  .row-prev{
    font-family:var(--serif);font-size:13.5px;color:var(--ink-3);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row-prev.has{color:var(--ink-2)}
  .arrow{flex:none;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg)}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow input{
    flex:1;min-width:0;font-family:var(--ui);font-size:15px;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  }
  .addrow input::placeholder{color:var(--ink-3)}
  .btn{font-family:var(--ui);font-size:14px;font-weight:600;cursor:pointer;background:var(--coral);color:#fff;border:0;border-radius:9px;padding:10px 16px}
  .btn:hover{filter:brightness(1.07)}

  /* ---- note ---- */
  .back{
    display:inline-flex;align-items:center;gap:7px;background:none;border:0;cursor:pointer;
    font-family:var(--ui);font-size:14px;font-weight:600;color:var(--teal);padding:0;margin-bottom:12px;
  }
  .back i{width:8px;height:8px;border-left:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:rotate(45deg)}
  .note-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h2{font-size:21px;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
  .del{background:none;border:0;cursor:pointer;color:var(--ink-3);font-size:13px;font-weight:600;padding:2px 4px}
  .del:hover{color:var(--coral)}
  textarea{
    width:100%;margin-top:12px;min-height:58vh;
    font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:15px;resize:vertical;
  }
  textarea::placeholder{color:var(--ink-3);font-style:italic}
  textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  .saved{font-size:12px;font-weight:600;color:var(--ink-3);margin:8px 0 0;height:16px}
</style>

<div class="wrap">
  <div id="view-list">
    <div class="head">
      <div>
        <h1>Fish Counter Notebook</h1>
        <p class="sub">Tap a topic and write down what you learn. It saves as you type.</p>
      </div>
      <button class="edit-btn" id="editbtn" type="button" aria-pressed="false">Edit</button>
    </div>
    <div class="list" id="list"></div>
    <form class="addrow" id="addform">
      <input id="addinput" placeholder="Add a topic&hellip;" autocomplete="off" aria-label="Add a topic">
      <button class="btn" type="submit">Add</button>
    </form>
  </div>

  <div id="view-note" hidden>
    <button class="back" id="back" type="button"><i></i>All topics</button>
    <div class="note-head">
      <h2 id="note-title"></h2>
      <button class="del" id="del" type="button">Delete</button>
    </div>
    <textarea id="editor" placeholder="Write it down&hellip;" aria-label="Notes"></textarea>
    <p class="saved" id="saved"></p>
  </div>
</div>

<script>
(function(){
  "use strict";

  var BUILTIN = [
    {id:"handing",  name:"Handing out food"},
    {id:"wrapping", name:"Wrapping food"},
    {id:"dates",    name:"Reading dates on food"},
    {id:"cleaning", name:"Cleaning tables"},
    {id:"bleach",   name:"Filling the bleach"},
    {id:"supplies", name:"Where supplies are in the back"},
    {id:"kitchen",  name:"The other kitchen"},
    {id:"knife",    name:"Using a knife"},
    {id:"ask",      name:"Stuff to ask about"},
    {id:"misc",     name:"Everything else"}
  ];

  var KEY = "fish-counter-notes-v2";
  var state = {notes:{}, custom:[], order:[], removed:[], updated:0};
  var dbRef = null, writing = false, dirty = false, timer = null, adopted = false, current = null;
  var editing = false;

  var $ = function(id){ return document.getElementById(id); };
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function normalize(o){
    var n = {notes:{}, custom:[], order:[], removed:[], updated:0};
    if(!o || typeof o !== "object") return n;
    if(o.notes && typeof o.notes === "object"){
      Object.keys(o.notes).forEach(function(k){
        if(typeof o.notes[k] === "string") n.notes[k] = o.notes[k];
      });
    }
    if(Array.isArray(o.custom)){
      n.custom = o.custom.filter(function(c){ return c && typeof c.name === "string"; })
        .map(function(c){ return {id: c.id || uid(), name: c.name}; });
    }
    ["order","removed"].forEach(function(k){
      if(Array.isArray(o[k])) n[k] = o[k].filter(function(x){ return typeof x === "string"; });
    });
    n.updated = typeof o.updated === "number" ? o.updated : 0;
    return n;
  }

  function topics(){
    var all = BUILTIN.concat(state.custom), by = {}, out = [], seen = {}, gone = {};
    all.forEach(function(t){ by[t.id] = t; });
    state.removed.forEach(function(id){ gone[id] = true; });
    state.order.forEach(function(id){
      if(by[id] && !gone[id] && !seen[id]){ seen[id] = true; out.push(by[id]); }
    });
    all.forEach(function(t){ if(!seen[t.id] && !gone[t.id]) out.push(t); });
    return out;
  }
  function nameOf(id){
    var t = BUILTIN.concat(state.custom).filter(function(x){ return x.id === id; })[0];
    return t ? t.name : "";
  }
  function ids(){ return topics().map(function(t){ return t.id; }); }

  function move(id, dir){
    var list = ids(), i = list.indexOf(id), j = i + dir;
    if(i < 0 || j < 0 || j >= list.length) return;
    list.splice(j, 0, list.splice(i, 1)[0]);
    state.order = list;
    touch(); renderList();
  }

  function removeTopic(id){
    var txt = (state.notes[id] || "").trim();
    var msg = txt ? "Delete \u201c" + nameOf(id) + "\u201d and everything written in it?"
                  : "Delete \u201c" + nameOf(id) + "\u201d?";
    if(!window.confirm(msg)) return;
    state.order = ids().filter(function(x){ return x !== id; });
    if(state.removed.indexOf(id) === -1) state.removed.push(id);
    state.custom = state.custom.filter(function(c){ return c.id !== id; });
    delete state.notes[id];
    touch(); renderList();
    return true;
  }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw) state = normalize(JSON.parse(raw));
    }catch(e){ /* blocked storage — carry on empty */ }
  }
  function saveLocal(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ /* nothing to do */ }
  }
  function touch(){
    state.updated = Date.now();
    saveLocal();
    if(timer) clearTimeout(timer);
    timer = setTimeout(push, 600);
  }
  function push(){
    if(!dbRef) return;
    if(writing){ dirty = true; return; }
    writing = true;
    dbRef.set({notes: state.notes, custom: state.custom, order: state.order,
               removed: state.removed, updated: state.updated}).then(function(){
      writing = false;
      if(dirty){ dirty = false; push(); }
    }).catch(function(err){
      writing = false;
      if(err && err.code === "unavailable"){ setTimeout(push, 1500 + Math.random()*1500); }
      else if(err && (err.code === "revoked" || err.code === "not_granted")){ dbRef = null; }
    });
  }

  function firstLine(txt){
    if(!txt) return "";
    var l = txt.split("\n").filter(function(s){ return s.trim(); })[0] || "";
    return l.length > 70 ? l.slice(0,70) + "…" : l;
  }

  function renderList(){
    var box = $("list");
    box.textContent = "";
    box.className = "list" + (editing ? " editing" : "");
    var list = topics();
    list.forEach(function(t, idx){
      var row = document.createElement("div");
      row.className = "row";

      var mv = document.createElement("div");
      mv.className = "mv";
      [["\u2191", -1, idx === 0], ["\u2193", 1, idx === list.length - 1]].forEach(function(spec){
        var mb = document.createElement("button");
        mb.type = "button"; mb.className = "mvb"; mb.textContent = spec[0];
        mb.disabled = spec[2];
        mb.setAttribute("aria-label", (spec[1] < 0 ? "Move up: " : "Move down: ") + t.name);
        mb.addEventListener("click", function(){ move(t.id, spec[1]); });
        mv.appendChild(mb);
      });

      var b = document.createElement("button");
      b.type = "button"; b.className = "row-open";
      var main = document.createElement("div");
      main.className = "row-main";
      var n = document.createElement("div");
      n.className = "row-name";
      n.textContent = t.name;
      var p = document.createElement("div");
      var txt = firstLine(state.notes[t.id]);
      p.className = "row-prev" + (txt ? " has" : "");
      p.textContent = txt || "Empty";
      main.appendChild(n); main.appendChild(p);
      var a = document.createElement("i");
      a.className = "arrow";
      b.appendChild(main); b.appendChild(a);
      b.addEventListener("click", function(){ if(!editing) open(t.id); });

      var rm = document.createElement("button");
      rm.type = "button"; rm.className = "rm"; rm.textContent = "Delete";
      rm.setAttribute("aria-label", "Delete " + t.name);
      rm.addEventListener("click", function(){ removeTopic(t.id); });

      row.appendChild(mv); row.appendChild(b); row.appendChild(rm);
      box.appendChild(row);
    });
  }

  function open(id){
    current = id;
    if(editing){ editing = false; $("editbtn").textContent = "Edit"; $("editbtn").setAttribute("aria-pressed","false"); }
    $("note-title").textContent = nameOf(id);
    var ed = $("editor");
    ed.value = state.notes[id] || "";
    $("saved").textContent = "";
    $("view-list").hidden = true;
    $("view-note").hidden = false;
    window.scrollTo(0,0);
    ed.focus();
  }

  function close(){
    current = null;
    $("view-note").hidden = true;
    $("view-list").hidden = false;
    renderList();
    window.scrollTo(0,0);
  }

  $("editbtn").addEventListener("click", function(){
    editing = !editing;
    var b = $("editbtn");
    b.textContent = editing ? "Done" : "Edit";
    b.setAttribute("aria-pressed", String(editing));
    renderList();
  });

  $("back").addEventListener("click", close);

  $("editor").addEventListener("input", function(e){
    if(!current) return;
    state.notes[current] = e.target.value;
    $("saved").textContent = "Saved";
    touch();
  });

  $("del").addEventListener("click", function(){
    if(current && removeTopic(current)) close();
  });

  $("addform").addEventListener("submit", function(e){
    e.preventDefault();
    var inp = $("addinput"), name = inp.value.trim();
    if(!name) return;
    var rec = {id: uid(), name: name};
    state.custom.push(rec);
    state.order = ids();
    inp.value = "";
    touch(); renderList(); open(rec.id);
  });

  // A one-time "#import=<base64 json>" link moves notes onto this device.
  // Nothing is sent anywhere: the fragment never leaves the browser.
  function importFromHash(){
    var h = window.location.hash || "";
    if(h.indexOf("#import=") !== 0) return;
    var inc = null;
    try{
      var b64 = h.slice(8).replace(/-/g, "+").replace(/_/g, "/");
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      inc = normalize(JSON.parse(new TextDecoder().decode(bytes)));
    }catch(e){ return; }
    var written = Object.keys(state.notes).filter(function(k){ return (state.notes[k] || "").trim(); });
    if(!written.length || window.confirm("Load the notes from this link onto this device?")){
      state = inc;
      state.updated = Date.now();
      saveLocal();
    }
    try{ window.history.replaceState(null, "", window.location.pathname + window.location.search); }
    catch(e){ window.location.hash = ""; }
  }

  // Pre-load notes for artifact
  var preload = {"notes":{"cleaning":"Get the cleaning cart, from the back, then sponge, cut sponge in half, fill the cart with water. After that, set the cleaning to wash and spray the three tables down on that setting, front and back of table platforms , scrub with sponge. then set cart to rinse, and rinse front and back completely of any soap, then get to small trays and place them underneath all of the table platforms, and set cleaning cart to sanitize. And spray one over and let dry. ","dates":"Ideally its supposed to be 4 days out from the day you package it. ","handing":"Ask what they want, what piece they want.\n\nGlove up, put plastic wrap on scale,\n type code on back of card attached to the desired item. PRINT LABEL WHILE ITEM IS ON SCALE. \n\nPlace paper on table, grab fish, put it on paper and wrap. Then place label on the wrapped fish. \n\nFor oysters/shellfish, loose shell fish make sure to type code and put in THE QUANTITY of how many they want then put in produce bag, print label. Put label on bag. Hand out. \n\n\n For shrimp and scallops, place a cardboard tray on scale and the tare is 3. grab desired amount they want place in the \nTray wrap in paper and stick label and hand out.\n\n\n\n\n\n","mu76ohuh5bog":"For pulling the case you need two empty carts. A fish cart and a shell fish cart.\n\nPlace paper on all trays on the cart. \n\nFor the fish cart the lobster tails, shrimp and scallops all go on the bottom of the cart. \n\n\nFor the shell fish cart barrier oysters and Chesapeake oysters on top. Then down the line, clams, little neck bags, and muscles. \n\nGrab bag from the meat department black cart. \n\nPlace over both carts. \n\n\n","wrapping":"Wrapping food is easy for family packs wrap long ways, for smaller trays, and gold pans wrap short ways. "},"custom":[{"id":"mu76ohuh5bog","name":"Pulling the case"},{"id":"mu76ugmqul84","name":"Food prep"}],"order":[],"removed":[],"updated":1789749842355};
  try { if(!localStorage.getItem(KEY)) localStorage.setItem(KEY, JSON.stringify(preload)); } catch(e) {}

  load();
  importFromHash();
  renderList();

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(db){
      if(!db) return;
      dbRef = db.doc("notes/state");
      dbRef.onSnapshot(function(snap){
        if(snap.metadata && snap.metadata.hasPendingWrites) return;
        var remote = snap.exists ? snap.data() : null;
        if(!remote){
          if(!adopted){ adopted = true; if(Object.keys(state.notes).length || state.custom.length) push(); }
          return;
        }
        var r = normalize(remote);
        if(!adopted){
          adopted = true;
          if(r.updated < (state.updated || 0)){ push(); return; }
        } else if(r.updated <= (state.updated || 0)) return;
        state = r;
        saveLocal();
        if(current){
          var ed = $("editor");
          var incoming = state.notes[current] || "";
          if(document.activeElement !== ed && ed.value !== incoming) ed.value = incoming;
        } else {
          renderList();
        }
      }, function(){ dbRef = null; });
    }).catch(function(){ /* stays local */ });
  }
})();
</script>

<script>
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline cache is optional */ });
    });
  }
</script>
</body>
</html>
