<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yumbrr — a poem is a screenshot</title>
<meta name="description" content="Write short poems and set them in the note-card format: a grainy photograph, quiet type, a few words in link blue.">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f8fafb'/><rect x='5' y='5' width='22' height='11' rx='1' fill='%232b2b2e'/><rect x='5' y='19' width='14' height='2.6' rx='1.3' fill='%23111'/><rect x='5' y='24' width='9' height='2.6' rx='1.3' fill='%233a66bd'/></svg>">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="mark"></span>
    <h1>yumbrr</h1>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-on" data-pane="write" role="tab">Write</button>
    <button class="tab" data-pane="craft" role="tab">Craft</button>
    <button class="tab" data-pane="shelf" role="tab">Shelf</button>
  </nav>
  <div class="bar-end">
    <button class="btn ghost" id="newBtn" title="Start a new poem">New</button>
    <button class="btn" id="saveBtn" title="Save to your shelf (⌘S)">Save</button>
  </div>
</header>

<main class="stage">

  <!-- ───────────── WRITE ───────────── -->
  <section class="pane pane-write is-on" data-pane="write">
    <div class="scroll">

      <div class="block">
        <div class="block-head">
          <h2>Photograph</h2>
          <span class="hint">the room they left, not the person</span>
        </div>
        <div class="drop" id="drop" tabindex="0">
          <input type="file" id="file" accept="image/*" hidden>
          <div class="drop-in">
            <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M3 17l5-6 4 4.5L15.5 12 21 18M3 5h18v14H3z"/></svg>
            <p><strong>Drop a photo</strong>, click, or paste</p>
            <small>Blurry and badly lit is correct.</small>
          </div>
        </div>
        <div class="film" id="film" hidden>
          <div class="looks" id="looks"></div>
          <label class="sl"><span>Grain</span><input type="range" id="grain" min="0" max="100" value="46"><i></i></label>
          <label class="sl"><span>Fade</span><input type="range" id="fade" min="0" max="100" value="22"><i></i></label>
          <label class="sl"><span>Warmth</span><input type="range" id="warmth" min="-50" max="50" value="14"><i></i></label>
          <label class="sl"><span>Light</span><input type="range" id="exposure" min="-50" max="50" value="0"><i></i></label>
          <label class="sl"><span>Vignette</span><input type="range" id="vignette" min="0" max="100" value="34"><i></i></label>
          <div class="film-foot">
            <small>Drag the photo in the card to reframe it.</small>
            <span class="film-btns">
              <button class="btn tiny ghost" id="swapPhoto">Replace</button>
              <button class="btn tiny ghost" id="clearPhoto">Remove</button>
            </span>
          </div>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <h2>The poem</h2>
          <span class="hint">blank line = stanza</span>
        </div>
        <div class="ed-tools">
          <button class="btn tiny" id="linkBtn" title="Make the selected words blue (⌘K)">
            <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>
            Blue
          </button>
          <span class="ed-count" id="count"></span>
        </div>
        <textarea id="text" spellcheck="true" placeholder="I was never good&#10;at being [human].&#10;&#10;teach me how to be [seventeen]&#10;on the floor of someone else's bedroom."></textarea>
        <div class="thread" id="thread"></div>
        <div class="notes" id="notes"></div>
      </div>

      <div class="block">
        <div class="block-head"><h2>Signature</h2></div>
        <div class="row">
          <label class="fld"><span>Initials</span><input type="text" id="attrib" maxlength="12" placeholder="your initials"></label>
          <label class="fld"><span>Handle</span><input type="text" id="handle" maxlength="28" placeholder="optional watermark"></label>
        </div>
        <label class="chk"><input type="checkbox" id="glyph" checked><span>Show the little page mark</span></label>
      </div>

    </div>
  </section>

  <!-- ───────────── CRAFT ───────────── -->
  <section class="pane pane-craft" data-pane="craft">
    <div class="scroll">
      <div class="prose" id="craftBody"></div>
    </div>
  </section>

  <!-- ───────────── SHELF ───────────── -->
  <section class="pane pane-shelf" data-pane="shelf">
    <div class="scroll">
      <div class="block">
        <div class="block-head">
          <h2>Shelf</h2>
          <span class="hint" id="shelfCount"></span>
        </div>
        <div class="shelf" id="shelf"></div>
        <div class="row gap">
          <button class="btn tiny ghost" id="exportAll">Export shelf (.json)</button>
          <button class="btn tiny ghost" id="importAll">Import…</button>
          <input type="file" id="importFile" accept="application/json" hidden>
        </div>
      </div>
    </div>
  </section>

  <!-- ───────────── CARD ───────────── -->
  <aside class="pane pane-card is-on" data-pane="card">
    <div class="card-wrap">
      <div class="card-hold">
        <canvas id="card" aria-label="Poem card preview"></canvas>
      </div>
      <div class="card-foot">
        <span class="tip">Tap a word to turn it blue.</span>
        <div class="card-acts">
          <select id="size" class="sel" title="Export width">
            <option value="1080">1080</option>
            <option value="1440" selected>1440</option>
            <option value="2160">2160</option>
          </select>
          <button class="btn" id="pngBtn">Save PNG</button>
        </div>
      </div>
    </div>
  </aside>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/craft.js"></script>
<script src="js/film.js"></script>
<script src="js/card.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
